<svg width="680" height="420" viewBox="0 0 680 420" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Mirai Coders team badge</title>
  <desc>Sleek dark hexagonal badge for Mirai Coders, transparent background</desc>
  <defs>
    <style>
      .hex-body { fill: #111520; stroke: #1e2a42; stroke-width: 1.5; }
      .hex-mid  { fill: none; stroke: #1e2a42; stroke-width: 0.6; opacity: 0.6; }
      .edge-top  { fill: none; stroke: #3d5a99; stroke-width: 1.2; }
      .tick { stroke: #3d5a99; stroke-width: 1.2; fill: none; }
      .tick-dot { fill: #3d5a99; }
      .slash { stroke: #9b8de8; stroke-width: 2.2; stroke-linecap: round; fill: none; }
      .bracket { stroke: #3d8ef0; stroke-width: 2.2; stroke-linecap: round; fill: none; }
      .scan { fill: none; stroke: #3d8ef0; stroke-width: 0.4; opacity: 0.15; }
      .label-name { font-family: 'Courier New', monospace; font-size: 26px; font-weight: 700; fill: #d6e4ff; letter-spacing: 5px; }
      .label-band { font-family: 'Courier New', monospace; font-size: 9.5px; font-weight: 400; fill: #3d5a99; letter-spacing: 7px; }
      .label-jp   { font-family: 'Segoe UI', 'Yu Gothic', sans-serif; font-size: 9px; fill: #6b5ea8; letter-spacing: 2.5px; }
      .sep { stroke: #1e2a42; stroke-width: 0.8; }
      .corner-ring { fill: none; stroke: #3d8ef0; stroke-width: 1; }
    </style>
  </defs>

  <!-- 背景なし（透過） -->

  <line x1="0" y1="80"  x2="680" y2="80"  class="scan"/>
  <line x1="0" y1="160" x2="680" y2="160" class="scan"/>
  <line x1="0" y1="240" x2="680" y2="240" class="scan"/>
  <line x1="0" y1="320" x2="680" y2="320" class="scan"/>
  <line x1="0" y1="400" x2="680" y2="400" class="scan"/>

  <polygon points="340,50 478,130 478,290 340,370 202,290 202,130" class="hex-body"/>
  <polygon points="340,72 460,142 460,278 340,348 220,278 220,142" class="hex-mid"/>

  <line x1="340" y1="50" x2="478" y2="130" class="edge-top"/>

  <circle cx="340" cy="50"  r="4.5" class="corner-ring"/>
  <circle cx="478" cy="130" r="4.5" class="corner-ring"/>
  <circle cx="478" cy="290" r="4.5" class="corner-ring"/>
  <circle cx="340" cy="370" r="4.5" class="corner-ring"/>
  <circle cx="202" cy="290" r="4.5" class="corner-ring"/>
  <circle cx="202" cy="130" r="4.5" class="corner-ring"/>
  <circle cx="340" cy="50"  r="2" class="tick-dot"/>
  <circle cx="478" cy="130" r="2" class="tick-dot"/>
  <circle cx="478" cy="290" r="2" class="tick-dot"/>
  <circle cx="340" cy="370" r="2" class="tick-dot"/>
  <circle cx="202" cy="290" r="2" class="tick-dot"/>
  <circle cx="202" cy="130" r="2" class="tick-dot"/>

  <line x1="202" y1="196" x2="188" y2="196" class="tick"/>
  <line x1="202" y1="210" x2="182" y2="210" class="tick"/>
  <circle cx="182" cy="210" r="2" class="tick-dot"/>
  <line x1="202" y1="224" x2="188" y2="224" class="tick"/>
  <line x1="478" y1="196" x2="492" y2="196" class="tick"/>
  <line x1="478" y1="210" x2="498" y2="210" class="tick"/>
  <circle cx="498" cy="210" r="2" class="tick-dot"/>
  <line x1="478" y1="224" x2="492" y2="224" class="tick"/>

  <polyline points="303,152 288,168 303,184" class="bracket"/>
  <polyline points="377,152 392,168 377,184" class="bracket"/>
  <line x1="328" y1="184" x2="352" y2="152" class="slash"/>

  <line x1="248" y1="200" x2="432" y2="200" class="sep"/>

  <text x="340" y="232" class="label-name" text-anchor="middle">MIRAI</text>
  <text x="340" y="263" class="label-name" text-anchor="middle">CODERS</text>

  <line x1="248" y1="278" x2="432" y2="278" class="sep"/>

  <text x="340" y="298" class="label-band" text-anchor="middle">TEAM</text>
  <text x="340" y="314" class="label-jp"   text-anchor="middle">未来のコーダーたち</text>
</svg>
